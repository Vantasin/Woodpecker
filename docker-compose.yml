---
services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:${VERSION}
    container_name: woodpecker-server
    restart: unless-stopped
    networks:
          - npm_proxy
          - woodpecker_internal
    volumes:
      - ${WOODPECKER_DATA_DIR}/woodpecker-server:/var/lib/woodpecker/
    environment:
      - WOODPECKER_HOST=${WOODPECKER_HOST}
      - WOODPECKER_EXPERT_WEBHOOK_HOST=${WOODPECKER_EXPERT_WEBHOOK_HOST:-${WOODPECKER_HOST}}
      - WOODPECKER_OPEN=${WOODPECKER_OPEN}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN}
      - WOODPECKER_GITEA=${WOODPECKER_GITEA}
      - WOODPECKER_GITEA_URL=${WOODPECKER_GITEA_URL}
      - WOODPECKER_EXPERT_FORGE_OAUTH_HOST=${WOODPECKER_EXPERT_FORGE_OAUTH_HOST}
      - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT}
      - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:${VERSION}
    container_name: woodpecker-agent
    restart: unless-stopped
    networks:
          - npm_proxy
          - woodpecker_internal
    depends_on:
      - woodpecker-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WOODPECKER_DATA_DIR}/woodpecker-agent:/etc/woodpecker
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_BACKEND_DOCKER_NETWORK=npm_proxy

networks:
  npm_proxy:
    external: true
  woodpecker_internal:
    driver: bridge
    internal: true
